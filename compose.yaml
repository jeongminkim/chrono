services:
  chrono:
    build: .
    container_name: chrono
    restart: unless-stopped
    volumes:
      - chrono-store:/var/lib/chrono
      # import 후 원본을 자동 삭제하므로 쓰기 가능으로 마운트한다.
      - ./import:/import
    expose:
      - "3000"
    networks:
      - websvr

volumes:
  chrono-store:

networks:
  websvr:
    external: true
